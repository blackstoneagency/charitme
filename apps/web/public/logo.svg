<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CharitMe">
  <defs>
    <linearGradient id="cm-heart" x1="120" y1="70" x2="400" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6322c9"/>
    </linearGradient>
    <linearGradient id="cm-inner" x1="200" y1="150" x2="312" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b4dff"/>
      <stop offset="1" stop-color="#6b28d4"/>
    </linearGradient>
    <linearGradient id="cm-hand" x1="110" y1="450" x2="430" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4ecff"/>
      <stop offset="1" stop-color="#e3cdfb"/>
    </linearGradient>
  </defs>

  <!-- Heart body -->
  <path d="M256 452
           C256 452 64 320 64 198
           C64 132 112 92 168 92
           C210 92 240 118 256 156
           C272 118 302 92 344 92
           C400 92 448 132 448 198
           C448 320 256 452 256 452 Z"
        fill="url(#cm-heart)" stroke="#4c1d95" stroke-width="6" stroke-opacity="0.55"/>

  <!-- Inner heart with white outline -->
  <path d="M256 244
           C256 244 196 206 196 168
           C196 148 211 135 230 135
           C242 135 251 142 256 152
           C261 142 270 135 282 135
           C301 135 316 148 316 168
           C316 206 256 244 256 244 Z"
        fill="url(#cm-inner)" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>

  <!-- Cradling hand -->
  <path d="M104 470
           C86 452 90 426 110 420
           C152 408 196 408 240 404
           C300 398 356 380 402 346
           C424 330 442 312 458 298
           C472 286 492 298 484 318
           C466 364 434 402 392 432
           C338 470 280 488 218 488
           C176 488 138 480 110 462
           C107 460 105 462 104 470 Z"
        fill="url(#cm-hand)"/>
</svg>
