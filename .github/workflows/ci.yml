name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · audit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Latest Node 20.x — the deploy pin (.node-version = 20.11.0) is too old
          # for the vitest 4 / rolldown toolchain, which needs util.styleText
          # (Node >= 20.12). Deploys (Vercel/Render) don't run the test toolchain.
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Unit tests
        run: npm test --workspace=apps/web

      - name: Campaign image audit (static)
        run: npm run audit:campaign-images --workspace=apps/web

      - name: Production build
        run: npm run build --workspace=apps/web
        env:
          # Placeholder values so the build is deterministic in CI without real
          # secrets. Static prerender of some pages (e.g. /faq) touches the
          # service-role Supabase client, whose Proxy throws only when the key
          # is absent — a non-empty placeholder lets construction succeed; no
          # network happens at build (supabase-js returns {error}, never throws).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      # ── End-to-end smoke ──────────────────────────────────────────────────
      # The e2e/ suite existed but ran in NO workflow, so nothing exercised the
      # app as a browser sees it. security-headers.spec.ts in particular covers
      # CSP and header behaviour that no unit test touches.
      #
      # Only the two DB-light specs run here. public-routes and public-quality
      # hit Supabase-backed pages and need real credentials, so they'd be flaky
      # against the placeholders below. Verified before wiring this up: these
      # two pass with exactly this placeholder env (6/6).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: End-to-end smoke (browser)
        run: npx playwright test e2e/smoke.spec.ts e2e/security-headers.spec.ts --project=chromium
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
