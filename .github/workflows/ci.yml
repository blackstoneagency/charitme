name: CI

# ⚠️ `paths-ignore` here is a COST control, not a preference.
#
# This repository is public, so standard hosted-runner minutes are not metered.
# The ignore list remains an efficiency control: documentation-only changes do
# not need to run the full build matrix twice. Measured
# on this repo: 5 of the last 15 commits changed only narrative markdown, and
# each one ran the full ~9-minute matrix — typecheck, lint, 2762 tests, audit,
# build, plus e2e — twice, once for the PR and once for the merge to master.
# About a third of those runs were spent on changes that cannot alter a
# test result.
#
# ⚠️ The list is EXPLICIT and must stay that way. `'**.md'` looks equivalent and
# is not: `AI/employees/*.md` and `AI/sprints/*.md` are compiled into
# `lib/ai-roster.generated.ts` by `prebuild`, and
# `__tests__/ai-control-center.test.ts` fails when the committed output drifts.
# A blanket markdown ignore would skip CI on a markdown change that genuinely
# breaks the build. `__tests__/ci-paths-ignore.test.ts` refuses any pattern that
# could match under `AI/`.
#
# ⚠️ If required status checks are ever enabled on `master`, revisit this: a
# skipped workflow leaves its check pending forever and would deadlock a
# docs-only PR. Nothing is required today, which is why this is safe now.
on:
  push:
    branches: [master]
    paths-ignore: &docs-only
      - 'todo.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'architecture.md'
      - 'decisions.md'
      - 'handoff.md'
      - 'payment-audit.md'
      - 'CAMPAIGN_IMAGE_AUDIT.md'
      - 'CAMPAIGN_IMAGE_CHANGELOG.md'
      - 'CAMPAIGN_IMAGE_SOURCES.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore: *docs-only

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch) —
# but NEVER on master.
#
# ⚠️ Measured 2026-08-09: master's post-merge CI could not finish AT ALL. Eight
# merges landed between 00:56 and 02:07 (mean gap 10.2 min, largest 17.7), while
# a full run needs upwards of an hour — the one e2e step that ever COMPLETED took
# 51.9m, and later ones were still running at 64m and 71m when observed (those
# are lower bounds, not durations; see the note above `timeout-minutes` below).
# Result: 7 runs cancelled, 1 still running, ZERO completed. Every
# master run was killed by the next merge before it cleared the build step, so a
# red master would have been invisible and "green on master" was not a claim
# anyone could substantiate.
#
# The fix gives each master COMMIT its own group, so master runs never cancel one
# another. Deliberately NOT `cancel-in-progress: false` on the shared group:
# that makes runs QUEUE instead, and at a 10-minute merge cadence against
# 60-minute runs the queue grows without bound — trading an absent signal for an
# ever-later one.
#
# The expression appends the sha ONLY on master; on every other ref it appends
# the empty string, so PR behaviour is byte-for-byte what it was — a new push to
# a PR branch still cancels its predecessor, which is the case this was written
# for. Public repo, so the extra parallel runs cost no billable minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  migration-replay:
    name: replay migrations and seeds from zero
    runs-on: ubuntu-latest
    # Observed ~3m45s end to end. 45 min is ~12x headroom and still bounds a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated database
        run: npx supabase start

      - name: Replay every migration and seed
        run: npx supabase db reset --local

      - name: Export isolated Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status --output env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Verify staging personas, tenants, data, and storage
        run: npm run test:platform-matrix

      # Authenticated RLS smoke, against the database this job just built from
      # zero. todo.md carried five near-identical open items reading "apply the
      # migration to staging and run authenticated RLS/payment smoke tests" —
      # all five waiting on an owner-provisioned staging project that does not
      # exist yet, so NOTHING ran an authenticated RLS check on any commit.
      #
      # This does not replace that project: an isolated replay is not a
      # production-shaped environment, and the pre-production gate still belongs
      # to the release workflow. What it does is make the *verification* half
      # real and continuous — anon must read zero rows from profiles, donations
      # and privacy_requests, and two freshly-created personas must each see
      # their own profile and never each other's. The script bootstraps and
      # deletes those personas itself and refuses any non-loopback URL.
      - name: Authenticated RLS smoke (isolated replay)
        env:
          BOOTSTRAP_LOCAL_RLS_PERSONAS: 'true'
          REQUIRE_AUTHENTICATED_RLS_PERSONAS: 'true'
        run: npm run test:rls-live

      - name: Campaign builder database smoke (isolated replay)
        run: npm run test:campaign-builder-db

      - name: Stop isolated database
        if: always()
        run: npx supabase stop --no-backup || true

  verify:
    name: typecheck · lint · test · build · e2e · a11y
    runs-on: ubuntu-latest
    # ⚠️ This is the deliberate replacement for a safety net that used to exist by
    # ACCIDENT. Before master stopped cancelling its own runs (see the concurrency
    # block above), a hung master run was cleared by the next merge. It no longer
    # is — which is the point of that change, but it means a hang now sits until
    # GitHub's default 360-minute cap, holding a runner and delaying the verdict
    # by six hours.
    #
    # 180 min against what has actually been MEASURED. Being precise about that,
    # because the first version of this comment was not:
    #
    #   · e2e, completed:  51.9m  (run 31286083199, 00:29:49 -> 01:21:41)
    #   · e2e, lower bounds on runs that had not finished when observed:
    #                     >=71m  (run 31289682235)  ~64m  (run 31292380747)
    #
    # ⚠️ Only the first is a duration. The other two are "still running when I
    # looked", which is a lower bound, not a measurement — an earlier draft of
    # this comment read "51.9m, 70m and 95m+ on successive commits" and called
    # that GROWTH. It is not: you cannot trend three numbers when two of them are
    # lower bounds on runs that never completed, and the 95m figure was simply
    # wrong. Do not cite a trend here until two runs have finished and been
    # compared.
    #
    # The bound is generous because the honest spread is wide, not because the
    # suite is known to be growing. It is here to catch a HANG, not to police a
    # slow suite. If a run ever trips it, the e2e suite has outgrown a single job
    # and should be split, not given a bigger number.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the supported Node 20 release line pinned in .node-version.
          # for the vitest 4 / rolldown toolchain, which needs util.styleText
          # (Node >= 20.12). Deploys (Vercel/Render) don't run the test toolchain.
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Unit tests
        run: npm test --workspace=apps/web

      - name: Campaign image audit (static)
        run: npm run audit:campaign-images --workspace=apps/web

      - name: Production build
        run: npm run build --workspace=apps/web
        env:
          # Placeholder values so the build is deterministic in CI without real
          # secrets. Static prerender of some pages (e.g. /faq) touches the
          # service-role Supabase client, whose Proxy throws only when the key
          # is absent — a non-empty placeholder lets construction succeed; no
          # network happens at build (supabase-js returns {error}, never throws).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key


  # ── End-to-end (browser) ────────────────────────────────────────────────────
  # The e2e/ suite existed but ran in NO workflow, so nothing exercised the app
  # as a browser sees it — security-headers.spec.ts in particular covers CSP and
  # header behaviour no unit test touches.
  #
  # A narrower version of this ran only smoke + security-headers on chromium, on
  # the assumption that public-routes/public-quality need real credentials. That
  # assumption was tested and is false: those sweeps failed for two fixable
  # reasons — one route needed seeded data (now probed and skipped via
  # e2e/data-routes.ts) and each sweep walks ~36 routes inside ONE test, so the
  # 30s cap tripped on slowness rather than defects (now 600s for the sweeps).
  # All four specs pass against the placeholder env below, on chromium AND
  # mobile: verified 16/16. Please don't re-narrow this without re-testing.
  #
  # ⚠️ These steps USED TO BE a second job, `e2e`, running in parallel with
  # `verify`. The comment justifying that said "parallelises with verify" — true,
  # and the right call when Actions minutes were free.
  #
  # Browser checks stay in the verify job so they reuse its compiled application.
  # Database replay is a separate parallel job because it exercises an isolated
  # Supabase stack and does not benefit from the Next.js build artifacts.

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: End-to-end tests (chromium + mobile)
        run: npx playwright test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      # Runtime sweeps that need a live server. playwright.config.ts tears its own
      # webServer down after the suite, so this step owns one. Two gotchas are
      # encoded deliberately:
      #   • it fails fast if the port is already taken — a stale server silently
      #     audits the OLD build and produces plausible-looking nonsense.
      #   • the pkill pattern is bracketed so it cannot match this step's own
      #     shell (`next-server` appears in that command line otherwise).
      # Both sweeps run against ONE server start,
      # so the axe sweep costs a sweep rather than another build — which matters
      # while Actions minutes are the binding constraint on this repo.
      #
      # ⚠️ `audit:a11y` is here because it was NOT, and that gap shipped a real
      # defect: six links on /impact wrapped an `alt=""` image and so announced
      # nothing to a screen reader (axe `link-name`, serious, both themes). It
      # reached master and no CI step could have caught it — this job ran
      # contrast only. Contrast and axe do not overlap: a link with no accessible
      # name has perfect contrast.
      - name: Runtime audits (WCAG AA contrast + axe, both themes)
        run: |
          set -e
          if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:3000/; then
            echo "::error::port 3000 already serving — audit would test a stale build"; exit 1
          fi
          npx next start -p 3000 &
          for i in $(seq 1 45); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          # Run BOTH before failing, so one red sweep does not hide the other's
          # findings. They are independent readers of the same built server and
          # can safely execute together.
          set +e
          npm run audit:contrast -- --base http://127.0.0.1:3000 & contrast_pid=$!
          npm run audit:a11y     -- --base http://127.0.0.1:3000 & a11y_pid=$!
          wait "$contrast_pid"; contrast=$?
          wait "$a11y_pid"; a11y=$?
          pkill -f "[n]ext-server" || true
          [ $contrast -ne 0 ] && echo "::error::contrast audit failed"
          [ $a11y -ne 0 ] && echo "::error::axe audit failed"
          [ $contrast -eq 0 ] && [ $a11y -eq 0 ]
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: Signed-in contrast audit (WCAG AA, both themes)
        run: npm run audit:signed-in -- --port 3310 --stub-port 55432
        working-directory: apps/web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
