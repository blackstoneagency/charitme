name: CI

# ⚠️ `paths-ignore` here is a COST control, not a preference.
#
# This repository is private, so Actions minutes are a finite monthly allowance,
# and exhausting it is the most likely cause of the runner outages recorded in
# CLAUDE.md (jobs created, no runner assigned, 0 billable ms, no steps). Measured
# on this repo: 5 of the last 15 commits changed only narrative markdown, and
# each one ran the full ~9-minute matrix — typecheck, lint, 2762 tests, audit,
# build, plus e2e — twice, once for the PR and once for the merge to master.
# About a third of the allowance was being spent on changes that cannot alter a
# test result.
#
# ⚠️ The list is EXPLICIT and must stay that way. `'**.md'` looks equivalent and
# is not: `AI/employees/*.md` and `AI/sprints/*.md` are compiled into
# `lib/ai-roster.generated.ts` by `prebuild`, and
# `__tests__/ai-control-center.test.ts` fails when the committed output drifts.
# A blanket markdown ignore would skip CI on a markdown change that genuinely
# breaks the build. `__tests__/ci-paths-ignore.test.ts` refuses any pattern that
# could match under `AI/`.
#
# ⚠️ If required status checks are ever enabled on `master`, revisit this: a
# skipped workflow leaves its check pending forever and would deadlock a
# docs-only PR. Nothing is required today, which is why this is safe now.
on:
  push:
    branches: [master]
    paths-ignore: &docs-only
      - 'todo.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'architecture.md'
      - 'decisions.md'
      - 'handoff.md'
      - 'payment-audit.md'
      - 'CAMPAIGN_IMAGE_AUDIT.md'
      - 'CAMPAIGN_IMAGE_CHANGELOG.md'
      - 'CAMPAIGN_IMAGE_SOURCES.md'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore: *docs-only

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · audit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the supported Node 20 release line pinned in .node-version.
          # for the vitest 4 / rolldown toolchain, which needs util.styleText
          # (Node >= 20.12). Deploys (Vercel/Render) don't run the test toolchain.
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Unit tests
        run: npm test --workspace=apps/web

      - name: Campaign image audit (static)
        run: npm run audit:campaign-images --workspace=apps/web

      - name: Production build
        run: npm run build --workspace=apps/web
        env:
          # Placeholder values so the build is deterministic in CI without real
          # secrets. Static prerender of some pages (e.g. /faq) touches the
          # service-role Supabase client, whose Proxy throws only when the key
          # is absent — a non-empty placeholder lets construction succeed; no
          # network happens at build (supabase-js returns {error}, never throws).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key


  # ── End-to-end (browser) ────────────────────────────────────────────────────
  # The e2e/ suite existed but ran in NO workflow, so nothing exercised the app
  # as a browser sees it — security-headers.spec.ts in particular covers CSP and
  # header behaviour no unit test touches.
  #
  # A narrower version of this ran only smoke + security-headers on chromium, on
  # the assumption that public-routes/public-quality need real credentials. That
  # assumption was tested and is false: those sweeps failed for two fixable
  # reasons — one route needed seeded data (now probed and skipped via
  # e2e/data-routes.ts) and each sweep walks ~36 routes inside ONE test, so the
  # 30s cap tripped on slowness rather than defects (now 600s for the sweeps).
  # All four specs pass against the placeholder env below, on chromium AND
  # mobile: verified 16/16. Please don't re-narrow this without re-testing.
  #
  # Runs as its own job so it parallelises with `verify` and can publish a report.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # playwright.config.ts owns the webServer (`npm start`), so the suite runs
      # against a real production build using the same placeholders as `verify`.
      - name: Production build
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: End-to-end tests (chromium + mobile)
        run: npx playwright test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      # Runtime WCAG AA contrast sweep. It needs a live server, and
      # playwright.config.ts tears its own webServer down after the suite, so this
      # step owns one. Two gotchas are encoded deliberately:
      #   • it fails fast if the port is already taken — a stale server silently
      #     audits the OLD build and produces plausible-looking nonsense.
      #   • the pkill pattern is bracketed so it cannot match this step's own
      #     shell (`next-server` appears in that command line otherwise).
      # Runtime sweeps that need a live server. Both run against ONE server start,
      # so the axe sweep costs a sweep rather than another build — which matters
      # while Actions minutes are the binding constraint on this repo.
      #
      # ⚠️ `audit:a11y` is here because it was NOT, and that gap shipped a real
      # defect: six links on /impact wrapped an `alt=""` image and so announced
      # nothing to a screen reader (axe `link-name`, serious, both themes). It
      # reached master and no CI step could have caught it — this job ran
      # contrast only. Contrast and axe do not overlap: a link with no accessible
      # name has perfect contrast.
      - name: Runtime audits (WCAG AA contrast + axe, both themes)
        run: |
          set -e
          if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:3000/; then
            echo "::error::port 3000 already serving — audit would test a stale build"; exit 1
          fi
          npx next start -p 3000 &
          for i in $(seq 1 45); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          # Run BOTH before failing, so one red sweep does not hide the other's
          # findings — `set -e` would otherwise abort at the first failure and
          # leave the second entirely unmeasured.
          set +e
          npm run audit:contrast -- --base http://127.0.0.1:3000; contrast=$?
          npm run audit:a11y     -- --base http://127.0.0.1:3000; a11y=$?
          pkill -f "[n]ext-server" || true
          [ $contrast -ne 0 ] && echo "::error::contrast audit failed"
          [ $a11y -ne 0 ] && echo "::error::axe audit failed"
          [ $contrast -eq 0 ] && [ $a11y -eq 0 ]
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.charitme.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
