# Compile the iOS app — no Apple account required.
#
# ⚠️ WHY THIS EXISTS, when `ios-archive.yml` is right there. That workflow builds
# a SIGNED archive, and its first step fails when the signing secrets are absent.
# Since those secrets have never been set, it has never run — which means
# **nothing has ever proven this app compiles**. Every other check in the repo,
# including `npm run ios:verify`, inspects the project's configuration; none of
# them invokes a compiler against the iOS SDK.
#
# Code signing is the only part that needs an Apple Developer account.
# Compilation does not. With `CODE_SIGNING_ALLOWED=NO` a macOS runner will
# type-check, compile and link the whole app — the app target, the Capacitor
# pods, and the storyboard/asset compilation — using the real iOS SDK.
#
# That is the difference between "the project is configured correctly" and "the
# code builds", and it is worth a separate workflow to have the second one.
#
# It also ARCHIVES, unsigned — a distinct operation from `build` that exercises
# the scheme's ArchiveAction, dSYM generation and the .xcarchive layout.
#
# What it cannot do is SIGN. An unsigned archive cannot be exported to an .ipa
# and will not run on a device, because only Apple can issue the certificate.
# That last step remains `ios-archive.yml`'s job and needs the three secrets.
name: iOS build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'capacitor.config.ts'
      - 'native/**'
      - 'scripts/prepare-ios.mjs'
      - 'scripts/verify-ios-project.mjs'
      - 'scripts/build-ios.sh'
      - '.github/workflows/ios-build.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'native/**'
      - 'scripts/prepare-ios.mjs'
      - 'scripts/verify-ios-project.mjs'
      - '.github/workflows/ios-build.yml'

# macOS runners are billed at a higher rate than ubuntu ones, so this is scoped
# to the paths that can actually break the native build rather than every push.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and prepare the Xcode project
        # `ios:sync` runs `cap sync` AND `scripts/prepare-ios.mjs`. Doing the two
        # by hand — as ios-archive.yml did — silently skips the usage
        # descriptions, the shared scheme, the app icon and the launch screen.
        run: npm run ios:add

      - name: Verify the generated project
        # Before the compiler, deliberately: these are the failures a successful
        # build does NOT catch — a launch crash from a missing usage description,
        # or a rejected upload from an unbundled privacy manifest.
        run: npm run ios:verify

      - name: Show the toolchain being used
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Compile for iOS (unsigned)
        # THE STEP THIS WORKFLOW EXISTS FOR. Type-checks and compiles every Swift
        # source against the real iOS SDK, compiles the storyboards and asset
        # catalog, and links the app — all of which are unreachable on Linux,
        # where `swiftc -typecheck` fails with "no such module 'UIKit'".
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit "${PIPESTATUS[0]}"

      - name: Archive (unsigned)
        # ⚠️ A DIFFERENT operation from `build`, not a formality. `archive` runs
        # the scheme's ArchiveAction, builds with the Release configuration for a
        # generic device, generates dSYMs, and assembles the .xcarchive layout —
        # a project can compile cleanly and still fail here (a scheme with no
        # ArchiveAction, a target excluded from the archive, a missing dSYM
        # setting). Signing is the only part of archiving that needs an Apple
        # account, so with it disabled the rest is verifiable.
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit "${PIPESTATUS[0]}"

      - name: Confirm the archive is well-formed
        # An .xcarchive is a directory with a required layout. Asserting the
        # payload and its Info.plist is what distinguishes "xcodebuild exited 0"
        # from "there is something here that could be exported".
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          test -d "$ARCHIVE" || { echo "::error::no .xcarchive produced"; exit 1; }
          test -d "$ARCHIVE/Products/Applications/App.app" \
            || { echo "::error::archive contains no app payload"; exit 1; }
          echo "Archive contents:"; ls "$ARCHIVE"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$ARCHIVE/Info.plist"
          echo "dSYMs:"; ls "$ARCHIVE/dSYMs" 2>/dev/null || echo "  (none)"

      - name: Upload the unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: charitme-ios-unsigned-archive
          path: ${{ runner.temp }}/App.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Confirm an app bundle was actually produced
        # A build that "succeeds" without emitting a bundle is the failure mode
        # every audit in this repo has hit at least once. Assert the artifact.
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData" -name 'App.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::Build reported success but produced no App.app"
            exit 1
          fi
          echo "Built: $APP"
          echo "Binary:"; file "$APP/App"
          # The compiled Info.plist proves the usage descriptions survived into
          # the bundle, not merely into the source project.
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy" \
            && echo "PrivacyInfo.xcprivacy IS in the bundle" \
            || { echo "::error::privacy manifest missing from the built bundle"; exit 1; }
