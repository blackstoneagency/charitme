# Archive the iOS app for App Store Connect.
#
# WHY THIS EXISTS: the iOS build was recorded as blocked on "macOS + Xcode",
# which nobody in a Linux sandbox can provide. GitHub provides macOS runners with
# Xcode preinstalled, so the toolchain half is solvable here — the same seam that
# turned the Android build from a toolchain problem into a secrets problem.
#
# What remains genuinely owner-side is the Apple Developer account: the signing
# certificate, the provisioning profile and the App Store Connect API key. Those
# are secrets, and no workflow can invent them.
#
# ⚠️ Manual only. An archive is not something to produce on every push.
name: iOS archive

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number — MUST be higher than the last upload for this version'
        required: true
        default: '1'

jobs:
  archive:
    # Xcode is preinstalled on the macOS images; a ubuntu runner cannot do this
    # at all, which is the whole reason this file is separate from the TWA build.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check the signing secrets are present
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # ⚠️ Fail here rather than at the archive step. Without a certificate
          # xcodebuild falls back to automatic signing, which on a runner with no
          # Apple account produces a confusing "no signing certificate found"
          # deep inside a 2,000-line log.
          missing=""
          [ -z "$CERT" ] && missing="$missing APPLE_CERTIFICATE_P12_BASE64"
          [ -z "$PROFILE" ] && missing="$missing APPLE_PROVISIONING_PROFILE_BASE64"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — add them in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Add the Capacitor iOS project
        run: |
          set -euo pipefail
          # ⚠️ Installed HERE, not in apps/web/package.json. These are native
          # build tooling, not runtime dependencies of the website, and adding
          # them to the app would put native plugins into every Vercel install.
          npm i --no-save @capacitor/core @capacitor/cli @capacitor/ios
          # capacitor.config.ts at the repo root points the shell at the live
          # origin; see docs/native-shells.md for why a static export is not
          # possible for this app.
          npx cap add ios
          npx cap sync ios

      - name: Install the privacy manifest
        run: |
          # Apple requires this in the app bundle. It is committed at
          # native/ios/PrivacyInfo.xcprivacy precisely because ios/ is generated
          # and therefore not in the repo — without this copy the declaration
          # would exist in the repo and be absent from every build.
          cp native/ios/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          echo "privacy manifest installed"

      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, unlocked only for this job. Importing into the
          # default login keychain would leave the certificate on the runner
          # image cache.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"

          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Set the version and build number
        env:
          VERSION: ${{ github.event.inputs.version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          cd ios/App
          # ⚠️ App Store Connect rejects a build whose number is not higher than
          # the last upload for that version, and the rejection arrives after the
          # upload finishes.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export the IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: charitme-ios-${{ github.event.inputs.version }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
